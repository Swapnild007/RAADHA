<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="RAADHA Studio: an AI-native website building workspace." />
    <title>RAADHA · AI Website Builder</title>
    <style>
      html,body{margin:0;min-height:100%;background:#08080b;color:#f4f4f5;font-family:system-ui,sans-serif}
      #boot-status{min-height:100vh;display:grid;place-content:center;text-align:center;padding:24px;box-sizing:border-box}
      #boot-status strong{font-size:18px}#boot-status p{max-width:420px;color:#a1a1aa;line-height:1.6;font-size:13px}
      #boot-status code{color:#c4b5fd;overflow-wrap:anywhere}
      #boot-status[hidden]{display:none}
    </style>
  </head>
  <body>
    <div id="boot-status" role="status" aria-live="polite">
      <strong>Loading RAADHA Studio…</strong>
      <p>If this message remains visible, the application could not start. Refresh once, then share any error shown here.</p>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener("error", function(event) {
        var status = document.getElementById("boot-status");
        if (!status || status.hidden) return;
        status.innerHTML = "<strong>RAADHA could not start</strong><p>" +
          String(event.message || "A script failed to load").replace(/[&<>"]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}) +
          "</p><p>Try refreshing. If it repeats, send this screen to RAADHA support.</p>";
      });
      window.addEventListener("unhandledrejection", function(event) {
        var status = document.getElementById("boot-status");
        if (!status || status.hidden) return;
        var reason = event.reason && event.reason.message ? event.reason.message : "Unexpected startup error";
        status.innerHTML = "<strong>RAADHA could not start</strong><p>" +
          String(reason).replace(/[&<>"]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}) +
          "</p>";
      });
    </script>
    <script type="module" src="/src/main.jsx" onerror="document.getElementById('boot-status').innerHTML='<strong>RAADHA assets failed to load</strong><p>The deployed app bundle could not be fetched. Check the deployment path and refresh once the app is available.</p>'"></script>
  </body>
</html>
