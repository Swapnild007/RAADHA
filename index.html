<title>RADHA</title>

<style id="radha-runtime-css">
:root{
 --bg:#f7f8fa;
 --surface:#ffffff;
 --surface-soft:#f1f3f6;
 --ink:#111827;
 --muted:#7d8795;
 --line:#e2e6eb;
 --accent:#263a5b;
 --accent-soft:#edf1f6;
 --gold:#a78b52;
 --green:#3d9b72;
 --shadow:0 20px 60px rgba(17,24,39,.08);
 --ease:cubic-bezier(.2,.75,.25,1)
}
*{box-sizing:border-box}
html,body,#root{margin:0;width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
body{font-size:14px}
button,input,textarea{font:inherit}
button{appearance:none;-webkit-appearance:none}
[role=button],button{cursor:pointer;-webkit-tap-highlight-color:transparent}
[role=button]:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid rgba(38,58,91,.22);outline-offset:3px}
.app{min-height:100dvh;background:radial-gradient(circle at 50% -10%,rgba(210,220,235,.42),transparent 34%),linear-gradient(180deg,#fafbfc,#f5f6f8)}
main{min-height:100dvh}
.topbar{height:60px;position:sticky;top:0;z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:rgba(250,251,252,.86);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid rgba(226,230,235,.8)}
.brand{grid-column:2;justify-self:center;display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:12px;color:var(--ink);user-select:none}
.brand-mark{width:29px;height:29px;display:block;flex:0 0 auto;border-radius:9px;box-shadow:0 7px 20px rgba(38,58,91,.14)}
.brand b{font-size:10px;letter-spacing:.18em;font-weight:760}.brand-mark{overflow:hidden}
.icon-btn,.mini-btn,.send-btn,.back-btn,.close-btn,.text-btn,.secondary,.quick,.recent,.context-card,.profile-link{
 appearance:none;-webkit-appearance:none;border:0;outline:0;text-decoration:none;box-shadow:none;
}
.icon-btn{width:35px;height:35px;display:grid;place-items:center;border-radius:10px;color:#6d7887;background:transparent}
.icon-btn:hover,.mini-btn:hover{background:#eef1f4;color:var(--ink)}
.topbar>.icon-btn{grid-column:1;justify-self:start;margin-left:14px}
.top-actions{grid-column:3;justify-self:end;display:flex;align-items:center;gap:4px;margin-right:14px}
.avatar{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid #d8dde4;color:var(--accent);font-size:10px;font-weight:800;box-shadow:0 1px 2px rgba(17,24,39,.03)}
.shell{width:min(860px,calc(100% - 40px));margin:auto;padding:46px 0 50px}
.enter{animation:enter .34s var(--ease)}
.home{width:min(780px,100%);margin:auto}
.hero{text-align:center;padding:30px 8px 32px}
.status{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--gold);font-size:8px;font-weight:800;letter-spacing:.19em;margin-bottom:14px}
.status i{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(61,155,114,.09)}
.hero h1{font-size:clamp(43px,6vw,64px);line-height:.98;letter-spacing:-.065em;font-weight:720;margin:0}
.hero h1 em{font-style:normal;color:#8992a0}
.hero p{max-width:430px;margin:16px auto 0;color:#89929f;font-size:12px;line-height:1.65}
.composer{background:rgba(255,255,255,.95);border:1px solid #d8dde4;border-radius:23px;padding:14px 14px 12px;box-shadow:var(--shadow);transition:.25s var(--ease)}
.composer:focus-within{border-color:#bfc8d4;box-shadow:0 25px 70px rgba(17,24,39,.12),0 0 0 4px rgba(38,58,91,.04)}
.composer textarea{display:block;width:100%;min-height:74px;max-height:180px;resize:none;border:0;outline:0;background:transparent;padding:6px 3px 14px;color:var(--ink);font-size:16px;line-height:1.5}
.composer textarea::placeholder{color:#a1a9b4}
.composer-bottom{display:flex;justify-content:space-between;align-items:center}
.composer-left{display:flex;gap:2px}
.mini-btn{width:35px;height:35px;display:grid;place-items:center;border-radius:10px;color:#737d8a;background:transparent}
.send-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#a3aab3;background:#e8ebee}
.send-btn.ready{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(38,58,91,.2)}
.send-btn.ready:hover{transform:translateY(-1px)}
.quick-row{display:flex;justify-content:center;gap:7px;overflow:auto;padding:12px 1px 1px;scrollbar-width:none}
.quick-row::-webkit-scrollbar{display:none}
.quick{height:34px;display:flex;align-items:center;gap:6px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.74);color:#667181;font-size:9px;white-space:nowrap}
.quick:hover{background:#fff;border-color:#cbd1d9;color:var(--ink)}
.recent-section{margin:52px auto 0;max-width:720px}
.section-title{display:flex;align-items:end;justify-content:space-between;margin-bottom:10px}
.section-title span{font-size:7px;font-weight:800;letter-spacing:.18em;color:var(--gold)}
.section-title h2{font-size:18px;letter-spacing:-.03em;margin:4px 0 0}
.text-btn{display:inline-flex;align-items:center;gap:4px;background:transparent;color:#707b89;font-size:9px;font-weight:700;padding:7px}
.recent-list{border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;background:rgba(255,255,255,.62);border-radius:16px}
.recent-row{width:100%;min-height:68px;display:flex;align-items:center;gap:12px;padding:10px 5px;border-bottom:1px solid #eceef1;background:transparent;color:var(--ink);text-align:left}
.recent-row:last-child{border-bottom:0}
.recent-row:hover{background:#fff}
.recent-row>i{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:#edf0f3;color:#697688;font-style:normal;flex:0 0 auto}
.recent-row span{min-width:0;display:grid;gap:3px;flex:1}
.recent-row b{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-row small{font-size:8px;color:var(--muted)}
.recent-row>svg{color:#a5acb5;margin-right:5px}
.conversation{height:calc(100dvh - 60px);width:min(820px,100%);margin:auto;display:flex;flex-direction:column}
.conversation-head{height:56px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.back-btn{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#edf0f3;color:#687487}
.conversation-title{display:flex;align-items:center;gap:8px;flex:1;font-size:11px;font-weight:700;min-width:0}
.conversation-title i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(61,155,114,.09)}
.messages{flex:1;overflow:auto;padding:34px 2px 22px;display:flex;flex-direction:column;gap:24px}
.messages article{display:flex;gap:10px;max-width:700px}
.messages article.user{align-self:flex-end;max-width:min(75%,600px);background:#e8ecf1;border-radius:18px 18px 5px 18px;padding:12px 14px}
.message-mark{width:27px;height:27px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:800;flex:0 0 auto}
.message-body{min-width:0}
.message-body small{display:block;color:#9ba3ad;font-size:7px;font-weight:800;letter-spacing:.13em;margin-bottom:5px}
.message-body p{font-size:12px;line-height:1.75;margin:0}
.working{display:flex;align-items:center;gap:7px;color:#818b98;font-size:9px}
.working i{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.1s infinite}
.working em{width:3px;height:3px;border-radius:50%;background:#aeb5be;animation:dot 1.1s infinite}
.working em:nth-last-child(2){animation-delay:.14s}.working em:last-child{animation-delay:.28s}
.conversation>.composer{margin-bottom:8px}
.overlay{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;padding:12px;background:rgba(17,24,39,.10);animation:fade .18s ease}
.sheet{width:min(620px,100%);background:rgba(255,255,255,.985);border:1px solid rgba(255,255,255,.9);border-radius:24px;padding:15px;box-shadow:0 25px 90px rgba(17,24,39,.2);animation:modal .22s var(--ease)}
.sheet.narrow{width:min(540px,100%)}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;padding:3px 3px 15px}
.sheet-head>div>span{font-size:7px;font-weight:800;letter-spacing:.18em;color:var(--gold)}
.sheet-head h2{font-size:23px;letter-spacing:-.045em;margin:5px 0 0}
.sheet-head p{font-size:9px;color:var(--muted);margin:5px 0 0}
.close-btn{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:#eef0f3;color:#6c7685}
.context-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.context-card{min-height:82px;display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:15px;background:#fff;color:#687486;text-align:left}
.context-card:hover{background:#f8f9fa;border-color:#cfd5dd}
.context-card>svg{flex:0 0 auto}
.context-card span{display:grid;gap:4px}
.context-card b{font-size:10px;color:var(--ink)}
.context-card small{font-size:7px;line-height:1.4;color:var(--muted)}
.top-overlay{align-items:flex-start;padding-top:68px}
.search-panel{width:min(620px,calc(100% - 20px));background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 25px 80px rgba(17,24,39,.18);padding:8px;animation:modal .2s var(--ease)}
.search-input{height:45px;display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid var(--line);border-radius:11px;color:#7b8491}
.search-input input{border:0;outline:0;min-width:0;flex:1;font-size:11px;color:var(--ink)}
.search-input kbd{font-size:7px;border:1px solid var(--line);border-radius:4px;padding:3px 5px;color:#9ba2ab}
.search-list{margin-top:5px}
.search-item{width:100%;min-height:56px;display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:8px;border-radius:10px;color:#6e7887}
.search-item:hover{background:#f4f5f7}
.search-item>svg{width:31px;height:31px;padding:7px;background:#eff1f3;border-radius:9px}
.search-item span{display:grid;gap:3px}
.search-item b{font-size:9px;color:var(--ink)}
.search-item small{font-size:7px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:9px}
.profile-link{width:100%;min-height:67px;display:flex;align-items:center;gap:11px;border-top:1px solid var(--line);background:transparent;text-align:left;color:#687486}
.profile-link>svg:first-child{width:33px;height:33px;padding:8px;border-radius:9px;background:#eef0f3}
.profile-link span{display:grid;gap:3px;flex:1}
.profile-link b{font-size:10px;color:var(--ink)}
.profile-link small{font-size:8px;color:var(--muted)}
.profile-link>svg:last-child{color:#a5acb5}
.library-items{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.library-items>div{min-height:62px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #eceef1}
.library-items>div:last-child{border-bottom:0}
.library-items>div>svg{width:32px;height:32px;padding:8px;border-radius:9px;background:#eef0f3;color:#6b7788}
.library-items span{display:grid;gap:3px}
.library-items b{font-size:10px}.library-items small{font-size:8px;color:var(--muted)}
.secondary{margin-top:10px;height:35px;padding:0 11px;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#657080;font-size:9px;font-weight:700}
.setting{min-height:66px;display:flex;align-items:center;gap:15px;border-top:1px solid var(--line)}
.setting span{display:grid;gap:4px;flex:1}.setting b{font-size:10px}.setting small{font-size:8px;color:var(--muted)}
.setting strong{font-size:9px;color:#78818e}
.toast{position:fixed;left:50%;bottom:20px;z-index:100;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:9px 13px;border-radius:999px;background:rgba(24,34,52,.95);color:#fff;font-size:9px;box-shadow:0 15px 45px rgba(17,24,39,.22)}
.launch{min-height:100dvh;display:grid;place-items:center;align-content:center;background:#f7f8fa}
.launch-mark{width:60px;height:60px;border-radius:18px;display:block;object-fit:cover;box-shadow:0 15px 35px rgba(38,58,91,.18)}
.launch b{margin-top:13px;font-size:10px;letter-spacing:.25em}
.launch small{margin-top:7px;font-size:7px;letter-spacing:.18em;color:#a0a7b1}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes modal{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{50%{transform:scale(1.35);opacity:.55}}
@keyframes dot{50%{opacity:.3;transform:translateY(-2px)}}
@media(max-width:700px){
 .topbar{height:55px}.topbar>.icon-btn{margin-left:6px}.top-actions{margin-right:6px}
 .shell{width:calc(100% - 24px);padding:26px 0 28px}
 .hero{padding:20px 4px 24px}.hero h1{font-size:clamp(39px,11vw,51px)}.hero p{font-size:10px}
 .composer{border-radius:19px;padding:11px}.composer textarea{min-height:76px;font-size:15px}
 .quick-row{margin-top:1px}.quick{height:30px;font-size:8px;padding:0 10px}
 .recent-section{margin-top:38px}.recent-row{min-height:63px}
 .conversation{height:calc(100dvh - 55px);padding:0 8px}
 .messages{padding-top:25px}.messages article.user{max-width:88%}
 .context-grid{grid-template-columns:1fr}.context-card{min-height:65px}
 .sheet{border-radius:20px;padding:11px}.sheet-head h2{font-size:21px}
 .top-overlay{padding-top:61px}
}
@media(max-width:480px){
 .shell{width:calc(100% - 18px);padding-top:17px}
 .brand b{font-size:9px}.brand-mark{width:28px;height:28px}
 .hero h1{font-size:38px}.hero p{font-size:9px;margin-top:11px}
 .composer textarea{min-height:72px}.mini-btn{width:32px;height:32px}.send-btn{width:37px;height:37px}
 .recent-row b{font-size:9px}.recent-row small{font-size:7px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

</style>

vw,51px);line-height:.98;letter-spacing:-.065em;margin:20px 0 0}.boot-home h1 em{font-style:normal;color:#8992a0}.boot-home p{max-width:430px;margin:14px auto;color:#89929f;font-size:10px;line-height:1.65}.boot-composer{margin:28px auto 0;width:100%;min-height:105px;padding:22px 18px;text-align:left;border:1px solid #d8dde4;border-radius:20px;background:#fff;color:#a1a9b4;box-shadow:0 20px 60px rgba(17,24,39,.08)}.boot-chips{display:flex;justify-content:center;gap:7px;overflow:hidden;margin-top:12px}.boot-chips span{padding:8px 12px;border:1px solid #e2e6eb;border-radius:999px;background:#fff;color:#667181;font-size:8px;white-space:nowrap}@media(max-width:480px){.boot-home{width:calc(100% - 18px);padding-top:42px}}</style></head>

  image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-4-4-7 7"/>',
  chart:'<path d="M5 20V10M12 20V4M19 20v-7M3 20h18"/>',
  code:'<path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  library:'<path d="M4 5a2 2 0 0 1 2-2h14v17H6a2 2 0 0 0-2 2Z"/><path d="M4 5v15M8 7h8M8 11h7"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.1h-2.4v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L6 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H4.7v-2.4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L6 8.6l1.7-1.7.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6v-.1h2.4v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.7 1.7-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1V14h-.1a1.7 1.7 0 0 0-1.6 1Z"/>',
  close:'<path d="m6 6 12 12M18 6 6 18"/>',
  back:'<path d="m15 18-6-6 6-6"/>',
  arrow:'<path d="M5 12h13M13 6l6 6-6 6"/>',
  more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  check:'<path d="m5 12 4 4L19 6"/>',
  refresh:'<path d="M20 11a8 8 0 0 0-14.9-3M4 5v4h4M4 13a8 8 0 0 0 14.9 3M20 19v-4h-4"/>'
 };
 return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(p[name]||p.spark)+'</svg>';
}
const esc=v=>String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const action=(cls,content,a,label="")=>'<div class="'+cls+'" role="button" tabindex="0" data-action="'+esc(a)+'"'+(label?' aria-label="'+esc(label)+'"':'')+'>'+content+'</div>';

function topbar(){
 return '<header class="topbar">'+
 action("icon-btn",icon("plus",19),"new","New conversation")+
 action("brand",mark("brand-mark") + "<b>RADHA</b>","home","RADHA")+
 '<div class="top-actions">'+action("icon-btn",icon("search",18),"search","Search")+
 action("avatar","S","profile","Profile")+'</div></header>';
}

function composer(){
 return '<div class="composer">'+
 '<textarea id="composer" rows="1" placeholder="Ask RADHA anything…">'+esc(state.composer)+'</textarea>'+
 '<div class="composer-bottom"><div class="composer-left">'+
 action("mini-btn",icon("plus",18),"tools","Add context")+
 action("mini-btn",icon("mic",17),"voice","Voice")+
 action("mini-btn",icon("camera",17),"vision","Image")+
 '</div>'+action("send-btn "+(state.composer.trim()?"ready":""),icon("arrow",17),"send","Send")+
 '</div></div>';
}

function home(){
 return '<section class="home">'+
 '<div class="hero">'+
 ''+
 '<h1>What are we<br><em>working on?</em></h1>'+
 '<p>Tell RADHA what you want to accomplish. We’ll work it out together.</p>'+
 '</div>'+
 composer()+
 '<div class="quick-row">'+
 action("quick",icon("globe",15)+"Research","prompt:Research the latest information about ") +
 action("quick",icon("file",15)+"Analyze files","tools")+
 action("quick",icon("image",15)+"Create","prompt:Create ")+
 action("quick",icon("code",15)+"Build","prompt:Build ")+
 '</div>'+
 '<section class="recent-section"><div class="section-title"><div><span>CONTINUE</span><h2>Recent work</h2></div>'+
 action("text-btn",icon("search",14)+"Search","search")+'</div>'+
 '<div class="recent-list">'+recent.map(r=>action("recent-row",'<i>'+icon(r.icon,16)+'</i><span><b>'+esc(r.title)+'</b><small>'+esc(r.meta)+'</small></span>'+icon("arrow",15),"chat:"+r.title)).join("")+
 '</div></section></section>';
}

function conversation(){
 const messages=state.messages.length?state.messages:[
  {role:"radha",text:"I'm ready. Tell me the outcome you want, and I'll work out the steps."}
 ];
 return '<section class="conversation">'+
 '<div class="conversation-head">'+action("back-btn",icon("back",18),"home","Back")+
 '<div class="conversation-title"><i></i><span>'+esc(state.chat||"RADHA")+'</span></div>'+
 action("icon-btn",icon("more",17),"more","More")+'</div>'+
 '<div class="messages">'+messages.map(m=>'<article class="'+m.role+'">'+
 (m.role==="radha"?'<div class="message-mark">R</div>':'')+
 '<div class="message-body"><small>'+ (m.role==="radha"?"RADHA":"YOU")+'</small><p>'+esc(m.text)+'</p></div></article>').join("")+
 (state.working?'<div class="working"><i></i><span>RADHA is working</span><em></em><em></em><em></em></div>':"")+
 '</div>'+composer()+'</section>';
}

function toolsSheet(){
 const items=[
  ["file","Files","PDFs, documents, spreadsheets","attach"],
  ["image","Photos","Images for understanding or creation","vision"],
  ["globe","Research","Search and investigate","prompt:Research the latest information about "],
  ["spark","Create","Images, video, documents","prompt:Create "],
  ["chart","Analyze","Data and structured information","prompt:Analyze "],
  ["code","Build","Software, websites and code","prompt:Build "]
 ];
 return overlay('<div class="sheet"><div class="sheet-head"><div><span>CONTEXT</span><h2>Give RADHA more to work with.</h2><p>Add something only when the task needs it.</p></div>'+action("close-btn",icon("close",18),"close","Close")+'</div>'+
 '<div class="context-grid">'+items.map(x=>action("context-card",icon(x[0],19)+'<span><b>'+x[1]+'</b><small>'+x[2]+'</small></span>',x[3])).join("")+'</div></div>');
}

function searchSheet(){
 const q=state.query.toLowerCase();
 const list=recent.filter(r=>(r.title+" "+r.meta).toLowerCase().includes(q));
 return '<div class="overlay top-overlay" data-action="close"><div class="search-panel" data-stop>'+
 '<div class="search-input">'+icon("search",18)+'<input id="search-input" autofocus value="'+esc(state.query)+'" placeholder="Search conversations and work"><kbd>Esc</kbd></div>'+
 '<div class="search-list">'+(list.length?list.map(r=>action("search-item",icon(r.icon,16)+'<span><b>'+esc(r.title)+'</b><small>'+esc(r.meta)+'</small></span>',"chat:"+r.title)).join(""):'<div class="empty">No matching work.</div>')+'</div></div></div>';
}

function profileSheet(){
 return overlay('<div class="sheet narrow"><div class="sheet-head"><div><span>YOU</span><h2>RADHA, your way.</h2><p>Everything important stays close.</p></div>'+action("close-btn",icon("close",18),"close","Close")+'</div>'+
 action("profile-link",icon("library",18)+'<span><b>Your library</b><small>Files, reports and creations</small></span>'+icon("arrow",15),"library")+
 action("profile-link",icon("settings",18)+'<span><b>Settings</b><small>Appearance, memory and privacy</small></span>'+icon("arrow",15),"settings")+
 '</div>');
}

function librarySheet(){
 return overlay('<div class="sheet narrow"><div class="sheet-head"><div><span>LIBRARY</span><h2>Your work.</h2><p>Everything RADHA has helped you create.</p></div>'+action("close-btn",icon("close",18),"close","Close")+'</div>'+
 '<div class="library-items">'+
 '<div>'+icon("image",17)+'<span><b>RADHA concept</b><small>Creation · Today</small></span></div>'+
 '<div>'+icon("globe",17)+'<span><b>AI landscape research</b><small>Research · Yesterday</small></span></div>'+
 '<div>'+icon("file",17)+'<span><b>Project brief</b><small>Document · Sep 30</small></span></div>'+
 '</div>'+action("secondary",""+icon("plus",15)+" Add files","attach")+'</div>');
}

function settingsSheet(){
 return overlay('<div class="sheet narrow"><div class="sheet-head"><div><span>SETTINGS</span><h2>Keep it simple.</h2><p>Control how RADHA behaves for you.</p></div>'+action("close-btn",icon("close",18),"close","Close")+'</div>'+
 setting("Appearance","Light, calm and readable.","Light")+
 setting("Memory","Use approved context across conversations.","Manage")+
 setting("Privacy","Control data and connected services.","View")+
 setting("Motion","Smooth interface transitions.","On")+
 '</div>');
}
function setting(a,b,c){return '<div class="setting"><span><b>'+a+'</b><small>'+b+'</small></span><strong>'+c+'</strong></div>'}

function overlay(inner){return '<div class="overlay" data-action="close">'+inner+'</div>'}

function render(){
 if(state.splash){root.innerHTML='<div class="launch">'+mark("launch-mark")+'<b>RADHA</b><small>ONE INTELLIGENCE</small></div>';return}
 let body=state.chat?conversation():home();
 let modal="";
 if(state.overlay==="tools")modal=toolsSheet();
 if(state.overlay==="search")modal=searchSheet();
 if(state.overlay==="profile")modal=profileSheet();
 if(state.overlay==="library")modal=librarySheet();
 if(state.overlay==="settings")modal=settingsSheet();
 root.innerHTML='<div class="app"><main>'+topbar()+'<div class="shell">'+body+'</div></main>'+modal+
 (state.toast?'<div class="toast">'+icon("check",13)+esc(state.toast)+'</div>':"")+'</div>';
 bind();
 requestAnimationFrame(()=>document.querySelector(".shell")?.classList.add("enter"));
}

function bind(){
 const input=document.getElementById("composer");
 if(input){
  input.addEventListener("input",e=>{state.composer=e.target.value;resizeComposer(input)});
  input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
  requestAnimationFrame(()=>resizeComposer(input));
 }
 const search=document.getElementById("search-input");
 if(search){
  search.addEventListener("input",e=>{state.query=e.target.value;render();requestAnimationFrame(()=>{const x=document.getElementById("search-input");x?.focus();x?.setSelectionRange(x.value.length,x.value.length)})});
  search.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
 }
}
function resizeComposer(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,180)+"px";document.querySelector(".send-btn")?.classList.toggle("ready",!!state.composer.trim())}
function close(){state.overlay=null;state.query="";render()}
function newChat(){state.chat=null;state.messages=[];state.composer="";close();requestAnimationFrame(()=>document.getElementById("composer")?.focus())}
function openChat(title){state.chat=title;state.messages=[];state.composer="";state.overlay=null;render()}
const RADHA_API_BASE=(window.RADHA_API_URL||"/api").replace(/\/$/,"");

async function send(){
 const text=state.composer.trim();if(!text||state.working)return;
 if(!state.chat)state.chat=text.length>50?text.slice(0,50)+"…":text;
 state.messages.push({role:"user",text});
 state.composer="";
 state.working=true;
 render();
 try{
  const response=await fetch(RADHA_API_BASE+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text,context:{timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC"}})});
  if(!response.ok)throw new Error("gateway unavailable");
  const data=await response.json();
  state.messages.push({role:"radha",text:data.reply||"RADHA completed the request without a response."});
 }catch(error){
  state.messages.push({role:"radha",text:"RADHA is ready, but its intelligence gateway is not reachable from this deployment yet."});
 }finally{
  state.working=false;
  render();
 }
}
function prompt(v){state.composer=v;state.overlay=null;render();requestAnimationFrame(()=>document.getElementById("composer")?.focus())}
function toast(m){state.toast=m;render();setTimeout(()=>{if(state.toast===m){state.toast="";render()}},1500)}
function attach(){
 const i=document.createElement("input");i.type="file";i.multiple=true;i.accept=".pdf,.doc,.docx,.txt,.csv,.xlsx,.xls,.ppt,.pptx,.png,.jpg,.jpeg,.webp";i.onchange=()=>toast((i.files?.length||0)+" file"+((i.files?.length||0)!==1?"s":"")+" ready");i.click();
}
function vision(){
 const i=document.createElement("input");i.type="file";i.accept="image/*";i.multiple=true;i.onchange=()=>toast((i.files?.length||0)+" image"+((i.files?.length||0)!==1?"s":"")+" ready");i.click();
}
function voice(){
 const R=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!R)return toast("Voice input is not supported here");
 if(state.voice){window.__radha?.stop();return}
 const r=new R();r.lang=navigator.language||"en-IN";r.interimResults=true;r.continuous=false;
 r.onstart=()=>{state.voice=true;render()};
 r.onresult=e=>{let t="";for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;state.composer=t;const el=document.getElementById("composer");if(el){el.value=t;resizeComposer(el)}};
 r.onend=()=>{state.voice=false;render()};r.onerror=()=>{state.voice=false;toast("Voice input could not start")};window.__radha=r;r.start();
}

document.addEventListener("click",e=>{
 const el=e.target.closest("[data-action]");if(!el)return;
 const a=el.dataset.action;
 if(a==="close"&&e.target.closest("[data-stop]"))return;
 if(a==="new")return newChat();
 if(a==="home")return newChat();
 if(a==="search"){state.overlay="search";state.query="";return render()}
 if(a==="profile"){state.overlay="profile";return render()}
 if(a==="tools"){state.overlay="tools";return render()}
 if(a==="close")return close();
 if(a==="send")return send();
 if(a==="attach")return attach();
 if(a==="vision")return vision();
 if(a==="voice")return voice();
 if(a==="library"){state.overlay="library";return render()}
 if(a==="settings"){state.overlay="settings";return render()}
 if(a==="more")return toast("More actions are coming with the intelligence layer.");
 if(a.startsWith("chat:"))return openChat(a.slice(5));
 if(a.startsWith("prompt:"))return prompt(a.slice(7));
});

document.addEventListener("keydown",e=>{
 const target=e.target?.closest?.("[role=button][data-action]");
 if(target&&(e.key==="Enter"||e.key===" ")){e.preventDefault();target.click();return}
 if(e.key==="Escape"&&state.overlay)close();
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();state.overlay="search";state.query="";render()}
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="n"){e.preventDefault();newChat()}
});

setTimeout(()=>{state.splash=false;render()},1100);
</script>
</body>
</html>
