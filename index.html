<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>RADHA</title>
<link rel="stylesheet" href="./styles.css">
<style>
:root{
  --bg:#f2f2f7;--surface:rgba(255,255,255,.72);--ink:#1d1d1f;--muted:#6e6e73;
  --line:rgba(60,60,67,.16);--blue:#0a84ff;--glass:rgba(249,249,249,.78)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif}
body{overflow-x:hidden}
button,input,textarea{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}
button:active{opacity:.55;transform:scale(.98)}
.app{min-height:100dvh;background:linear-gradient(#f5f5f7,#f2f2f7 55%,#ededf2)}
.glass{background:var(--glass);border:1px solid rgba(255,255,255,.8);box-shadow:0 1px 3px rgba(0,0,0,.05);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px)}
.topbar{position:fixed;z-index:20;top:0;left:0;right:0;height:64px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.topgroup{display:flex;align-items:center;gap:8px;pointer-events:auto}
.glassbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#3a3a3c;font-size:22px}
.brand{height:38px;padding:0 12px;border-radius:19px;display:flex;align-items:center;gap:7px;font-size:15px;font-weight:600}
.logo{width:24px;height:24px;border-radius:7px;background:#243e63;display:grid;place-items:center}
.logo svg{width:17px}.avatar{font-size:13px;font-weight:600}
main{width:min(920px,100%);margin:auto;padding:86px 20px 150px}
.workspace{min-height:calc(100dvh - 220px);display:flex;flex-direction:column;align-items:center;text-align:center}
.identity{display:none}
.eyebrow{font-size:17px;letter-spacing:-.01em;color:var(--muted);font-weight:500;margin:18px 0 12px}
.title{font-size:clamp(42px,7vw,64px);letter-spacing:-.055em;line-height:1.02;margin:0;font-weight:700}
.subtitle{max-width:570px;margin:18px auto 0;color:var(--muted);font-size:15px;line-height:1.5}
.quick{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:28px}
.quick button{padding:10px 16px;border-radius:20px;background:rgba(255,255,255,.72);border:1px solid var(--line);color:#3a3a3c;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.quick button:hover{background:#fff}
.conversation{width:min(760px,100%);margin-top:30px;display:none;text-align:left}
.conversation.visible{display:block}
.message{display:flex;margin:13px 0}.message.user{justify-content:flex-end}
.bubble{max-width:82%;padding:13px 16px;border-radius:20px;background:#fff;border:1px solid var(--line);line-height:1.5;font-size:15px}
.user .bubble{background:#0a84ff;color:#fff;border-color:transparent;border-bottom-right-radius:7px}
.radha .bubble{border-bottom-left-radius:7px}
.composerWrap{position:fixed;z-index:18;left:50%;bottom:78px;transform:translateX(-50%);width:min(720px,calc(100% - 28px))}
.composer{border-radius:25px;padding:6px 7px 6px;display:flex;align-items:flex-end;gap:4px}
.prompt{flex:1;min-height:43px;max-height:140px;resize:none;border:0;outline:0;background:transparent;padding:11px 8px;color:var(--ink);font-size:17px;line-height:1.35}
.prompt::placeholder{color:#8e8e93}
.action{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#6e6e73;font-size:21px;flex:0 0 auto}
.action:hover{background:rgba(0,0,0,.04)}
.send{background:#0a84ff;color:#fff;font-size:22px}
.send:disabled{background:#d1d1d6;color:#fff}
.bottomnav{position:fixed;z-index:19;left:0;right:0;bottom:0;height:72px;padding:5px max(14px,env(safe-area-inset-left)) calc(5px + env(safe-area-inset-bottom));border-radius:0;display:flex;justify-content:space-around;align-items:flex-start;border-left:0;border-right:0;border-bottom:0;box-shadow:0 -1px 8px rgba(0,0,0,.06)}
.navitem{height:58px;min-width:70px;padding:5px 10px;border-radius:12px;color:#8e8e93;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.navitem.active{color:#0a84ff;background:transparent;box-shadow:none}
.navicon{font-size:22px;line-height:24px}.navlabel{display:inline}
.panel{position:fixed;z-index:30;right:12px;top:58px;width:min(320px,calc(100% - 24px));padding:8px;border-radius:18px;opacity:0;pointer-events:none;transform:translateY(-6px) scale(.98);transition:.2s}
.panel.open{opacity:1;pointer-events:auto;transform:none}
.panel h3{font-size:20px;margin:8px 12px 4px}.panel p{font-size:13px;color:var(--muted);line-height:1.45;margin:0 12px 8px}
.panel button{display:flex;justify-content:space-between;width:100%;padding:11px 12px;border-radius:11px;text-align:left;font-size:15px}
.panel button:hover{background:rgba(0,0,0,.04)}
.panel .close{color:#0a84ff}
.toast{position:fixed;z-index:40;left:50%;bottom:145px;transform:translate(-50%,12px);opacity:0;background:rgba(29,29,31,.9);color:#fff;padding:9px 14px;border-radius:14px;font-size:12px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.splash{position:fixed;z-index:100;inset:0;background:#f2f2f7;display:grid;place-items:center;transition:opacity .45s ease}.splash.off{opacity:0;pointer-events:none}.splashInner{text-align:center}.splashMark{width:58px;height:58px;margin:auto;border-radius:15px;background:#243e63;display:grid;place-items:center}.splashMark svg{width:38px}.splashName{margin-top:14px;font-size:17px;font-weight:600;letter-spacing:-.02em}.splashTag{margin-top:4px;font-size:11px;color:#8e8e93}
@media(min-width:800px){main{padding-bottom:170px}.composerWrap{bottom:92px;width:min(720px,calc(100% - 40px))}.bottomnav{left:50%;right:auto;bottom:16px;width:min(560px,calc(100% - 32px));height:62px;border:1px solid rgba(255,255,255,.8);border-radius:20px;transform:translateX(-50%);padding-bottom:5px;box-shadow:0 8px 30px rgba(0,0,0,.08)}}
@media(max-width:620px){.topbar{padding:9px 12px;height:60px}.brand{height:38px}.brand .brandText{display:inline}.glassbtn{width:38px;height:38px}main{padding:78px 16px 155px}.workspace{min-height:calc(100dvh - 230px)}.title{font-size:44px}.subtitle{font-size:14px;max-width:340px}.quick{margin-top:23px}.composerWrap{bottom:76px}.composer{border-radius:23px}.prompt{font-size:16px}.panel{top:55px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="topgroup">
    <button class="glass glassbtn" id="new" aria-label="New">＋</button>
    <div class="glass brand"><span class="logo"></span><span class="brandText">RADHA</span></div>
  </div>
  <div class="topgroup">
    <button class="glass glassbtn" id="search" aria-label="Search">⌕</button>
    <button class="glass glassbtn avatar" id="profile" aria-label="Account">S</button>
  </div>
</header>
<main>
<section class="workspace">
  <div class="eyebrow">RADHA</div>
  <h1 class="title">What do you want<br>to get done?</h1>
  <p class="subtitle">One intelligence for reasoning, research, creation, analysis and execution.</p>
  <div class="quick">
    <button data-fill="Research and compare ">Research</button>
    <button data-fill="Analyze this ">Analyze</button>
    <button data-fill="Create ">Create</button>
    <button data-fill="Build ">Build</button>
  </div>
  <div class="conversation" id="conversation"></div>
</section>
</main>
<nav class="glass bottomnav" aria-label="RADHA">
  <button class="navitem active" id="home"><span class="navicon">⌂</span><span class="navlabel">Home</span></button>
  <button class="navitem" id="library"><span class="navicon">▱</span><span class="navlabel">Library</span></button>
  <button class="navitem" id="activity"><span class="navicon">◌</span><span class="navlabel">Activity</span></button>
  <button class="navitem" id="settings"><span class="navicon">⚙</span><span class="navlabel">Settings</span></button>
</nav>
<div class="composerWrap">
  <div class="glass composer">
    <button class="action" id="attach" aria-label="Add">＋</button>
    <textarea class="prompt" id="prompt" rows="1" placeholder="Ask RADHA…"></textarea>
    <button class="action" id="voice" aria-label="Voice">◉</button>
    <button class="action send" id="send" aria-label="Send" disabled>↑</button>
  </div>
</div>
<div class="glass panel" id="panel">
  <button class="close" id="close">Close <span>×</span></button>
  <h3>RADHA</h3>
  <p>Your intelligence workspace.</p>
  <button id="panelLibrary">Library <span>›</span></button>
  <button id="panelSettings">Settings <span>›</span></button>
</div>
<div class="toast" id="toast"></div>
<div class="splash" id="splash"><div class="splashInner"><div class="splashMark" id="splashMark"></div><div class="splashName">RADHA</div><div class="splashTag">ONE INTELLIGENCE</div></div></div>
</div>
<script>
(()=> {
const mark='<svg viewBox="0 0 64 64"><path fill="#fff" d="M15 47V17h14c11 0 18 5 18 14 0 6-3 10-8 12l8 4H36l-7-4h-5v4H15Zm9-12h5c6 0 9-2 9-6s-3-6-9-6h-5v12Z"/><circle cx="47" cy="15" r="4" fill="#b49458"/></svg>';
document.querySelector('.logo').innerHTML=mark;
document.getElementById('splashMark').innerHTML=mark;
const prompt=document.getElementById('prompt'),send=document.getElementById('send'),conversation=document.getElementById('conversation'),panel=document.getElementById('panel');
const toast=(t)=>{const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),1700)};
const resize=()=>{prompt.style.height='auto';prompt.style.height=Math.min(prompt.scrollHeight,150)+'px'};
prompt.addEventListener('input',()=>{send.disabled=!prompt.value.trim();resize()});
document.querySelectorAll('[data-fill]').forEach(b=>b.onclick=()=>{prompt.value=b.dataset.fill;prompt.focus();send.disabled=false;resize()});
document.getElementById('new').onclick=()=>{conversation.innerHTML='';conversation.classList.remove('visible');prompt.value='';send.disabled=true;prompt.focus()};
document.getElementById('profile').onclick=()=>panel.classList.add('open');
document.getElementById('search').onclick=()=>toast('Search is ready for your RADHA workspace.');
document.getElementById('close').onclick=()=>panel.classList.remove('open');
document.getElementById('library').onclick=()=>toast('Library is the persistent work layer.');
document.getElementById('activity').onclick=()=>toast('Activity');
document.getElementById('settings').onclick=()=>toast('Settings');
document.getElementById('home').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('attach').onclick=()=>toast('Attach files, images or documents.');
document.getElementById('voice').onclick=()=>toast('Voice input ready.');
document.getElementById('panelLibrary').onclick=()=>toast('Library workspace ready.');
document.getElementById('panelSettings').onclick=()=>toast('Settings workspace ready.');
async function submit(){
 const text=prompt.value.trim(); if(!text)return;
 addMessage('user',text); prompt.value=''; send.disabled=true; resize();
 conversation.classList.add('visible');
 addMessage('radha','Thinking…','thinking');
 try{
   const res=await fetch('./api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,context:{surface:'workspace'}})});
   if(!res.ok) throw new Error('gateway unavailable');
   const data=await res.json();
   replaceThinking(data.reply || 'RADHA completed the request.');
 }catch(e){
   replaceThinking('RADHA understood the request. Connect the Intelligence Gateway to execute it.');
 }
}
function addMessage(role,text,cls=''){const wrap=document.createElement('div');wrap.className='message '+role+(cls?' '+cls:'');const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;wrap.appendChild(bubble);conversation.appendChild(wrap);conversation.scrollIntoView({behavior:'smooth',block:'end'});}
function replaceThinking(text){const el=conversation.querySelector('.thinking:last-child .bubble');if(el)el.textContent=text}
send.onclick=submit;
prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}});
const hideSplash=()=>{const el=document.getElementById('splash');if(el)el.classList.add('off')};
window.setTimeout(hideSplash,900);
window.addEventListener('load',hideSplash,{once:true});
})();
</script>
<script src="./main.js"></script>
</body>
</html>
