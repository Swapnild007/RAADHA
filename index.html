<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>RADHA</title>
<link rel="stylesheet" href="./styles.css">
<style>
:root{
  --bg:#f5f5f7;--surface:rgba(255,255,255,.68);--glass:rgba(255,255,255,.58);
  --ink:#17181c;--muted:#737780;--soft:#a2a5ab;--line:rgba(25,28,35,.10);
  --accent:#294267;--gold:#b49458;--shadow:0 20px 60px rgba(30,35,45,.10)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif}
body{overflow-x:hidden}
button,input,textarea{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}
button:active{transform:scale(.97)}
.app{min-height:100dvh;position:relative;background:
 radial-gradient(circle at 18% 5%,rgba(214,223,235,.72),transparent 32%),
 radial-gradient(circle at 86% 52%,rgba(232,225,211,.48),transparent 34%),var(--bg)}
/* iOS-inspired functional glass layer */
.topbar{position:fixed;z-index:20;left:0;right:0;top:0;height:74px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.glass{background:var(--glass);border:1px solid rgba(255,255,255,.82);box-shadow:0 10px 35px rgba(30,35,45,.07),inset 0 1px rgba(255,255,255,.85);backdrop-filter:blur(26px) saturate(145%);-webkit-backdrop-filter:blur(26px) saturate(145%)}
.topgroup{display:flex;align-items:center;gap:8px;pointer-events:auto}
.glassbtn{height:42px;min-width:42px;padding:0 14px;border-radius:999px;display:grid;place-items:center;color:#606771;font-size:18px}
.brand{height:42px;padding:0 15px;border-radius:999px;display:flex;align-items:center;gap:9px;font-size:12px;font-weight:800;letter-spacing:.18em}
.logo{width:28px;height:28px;border-radius:9px;background:var(--accent);display:grid;place-items:center;box-shadow:0 4px 12px rgba(41,66,103,.2)}
.logo svg{width:19px}.avatar{width:42px!important;padding:0!important;border-radius:50%!important;font-size:11px;font-weight:800}
main{width:min(980px,100%);margin:auto;padding:110px 18px 170px}
.workspace{min-height:calc(100dvh - 280px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.identity{display:grid;place-items:center;margin-bottom:22px}
.identity .orb{width:64px;height:64px;border-radius:21px;background:linear-gradient(145deg,#344f76,#223755);display:grid;place-items:center;box-shadow:0 18px 45px rgba(41,66,103,.20),inset 0 1px rgba(255,255,255,.35);animation:breathe 4s ease-in-out infinite}
.orb svg{width:40px}
.eyebrow{font-size:10px;letter-spacing:.20em;text-transform:uppercase;color:#9a8050;font-weight:800;margin-bottom:10px}
.title{font-size:clamp(38px,7vw,68px);letter-spacing:-.065em;line-height:.98;margin:0;font-weight:760}
.subtitle{max-width:560px;margin:15px auto 0;color:var(--muted);font-size:14px;line-height:1.55}
.quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:25px}
.quick button{padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.52);border:1px solid var(--line);color:#636a74;font-size:11px;box-shadow:0 5px 20px rgba(30,35,45,.035)}
.quick button:hover{background:rgba(255,255,255,.85)}
.conversation{width:min(760px,100%);margin-top:30px;display:none;text-align:left}
.conversation.visible{display:block}
.message{display:flex;margin:13px 0}.message.user{justify-content:flex-end}
.bubble{max-width:82%;padding:13px 16px;border-radius:20px;background:rgba(255,255,255,.75);border:1px solid var(--line);line-height:1.5;font-size:14px;box-shadow:0 8px 25px rgba(30,35,45,.045)}
.user .bubble{background:var(--accent);color:#fff;border-color:transparent;border-bottom-right-radius:7px}
.radha .bubble{border-bottom-left-radius:7px}
.composerWrap{position:fixed;z-index:18;left:50%;bottom:21px;transform:translateX(-50%);width:min(760px,calc(100% - 22px));}
.composer{border-radius:28px;padding:7px 8px 8px;display:flex;align-items:flex-end;gap:5px}
.prompt{flex:1;min-height:46px;max-height:150px;resize:none;border:0;outline:0;background:transparent;padding:13px 9px 10px;color:var(--ink);font-size:16px;line-height:1.35}
.prompt::placeholder{color:#999da4}
.action{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#707781;font-size:18px;flex:0 0 auto}
.action:hover{background:rgba(255,255,255,.75)}
.send{background:var(--accent);color:#fff;box-shadow:0 7px 18px rgba(41,66,103,.22)}
.send:disabled{opacity:.25;box-shadow:none}
.bottomnav{position:fixed;z-index:19;bottom:91px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:999px}
.navitem{height:40px;min-width:44px;padding:0 13px;border-radius:999px;color:#6d737d;font-size:11px;display:flex;align-items:center;justify-content:center;gap:6px}
.navitem.active{background:rgba(255,255,255,.76);color:#20242a;box-shadow:0 5px 18px rgba(30,35,45,.07)}
.navicon{font-size:17px}.navlabel{display:none}.navitem.active .navlabel{display:inline}
.panel{position:fixed;z-index:30;right:14px;top:67px;width:min(340px,calc(100% - 28px));padding:18px;border-radius:26px;opacity:0;pointer-events:none;transform:translateY(-8px) scale(.98);transition:.22s}
.panel.open{opacity:1;pointer-events:auto;transform:none}
.panel h3{font-size:21px;margin:2px 0 6px}.panel p{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 12px}
.panel button{display:flex;justify-content:space-between;width:100%;padding:12px 10px;border-radius:14px;text-align:left;font-size:14px}
.panel button:hover{background:rgba(255,255,255,.7)}
.panel .close{color:#69717b}
.toast{position:fixed;z-index:40;left:50%;bottom:150px;transform:translate(-50%,15px);opacity:0;background:rgba(28,31,36,.88);color:#fff;padding:10px 15px;border-radius:999px;font-size:11px;backdrop-filter:blur(15px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.splash{position:fixed;z-index:100;inset:0;background:#f5f5f7;display:grid;place-items:center;transition:opacity .55s ease}.splash.off{opacity:0;pointer-events:none}.splashInner{text-align:center}.splashMark{width:76px;height:76px;margin:auto;border-radius:24px;background:var(--accent);display:grid;place-items:center;box-shadow:0 25px 65px rgba(41,66,103,.18)}.splashMark svg{width:50px}.splashName{margin-top:17px;font-size:14px;font-weight:800;letter-spacing:.27em}.splashTag{margin-top:7px;font-size:8px;color:#969ca4;letter-spacing:.20em}
@keyframes breathe{0%,100%{transform:translateY(0);box-shadow:0 18px 45px rgba(41,66,103,.20),inset 0 1px rgba(255,255,255,.35)}50%{transform:translateY(-3px);box-shadow:0 23px 55px rgba(41,66,103,.25),inset 0 1px rgba(255,255,255,.35)}}
@media(min-width:800px){.navlabel{display:inline}.bottomnav{bottom:26px;left:auto;right:26px;transform:none}.composerWrap{bottom:24px;left:50%;}.workspace{min-height:calc(100dvh - 230px)}}
@media(max-width:620px){.topbar{height:65px;padding:9px 10px}.brand{height:40px;padding:0 12px}.brand .brandText{display:none}.glassbtn{height:40px;min-width:40px;padding:0 12px}main{padding:88px 14px 165px}.workspace{min-height:calc(100dvh - 250px)}.title{font-size:43px}.subtitle{font-size:13px;max-width:330px}.identity .orb{width:58px;height:58px;border-radius:19px}.quick{margin-top:20px}.bottomnav{bottom:88px}.navitem{height:38px;padding:0 12px}.navitem.active .navlabel{display:none}.composerWrap{bottom:14px}.composer{border-radius:25px}.prompt{font-size:15px}.panel{top:62px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="topgroup">
    <button class="glass glassbtn" id="new" aria-label="New conversation">＋</button>
    <div class="glass brand"><span class="logo"></span><span class="brandText">RADHA</span></div>
  </div>
  <div class="topgroup">
    <button class="glass glassbtn" id="search" aria-label="Search">⌕</button>
    <button class="glass glassbtn avatar" id="profile" aria-label="Profile">S</button>
  </div>
</header>
<main>
<section class="workspace">
  <div class="identity"><div class="orb" id="orb"></div></div>
  <div class="eyebrow">One intelligence</div>
  <h1 class="title">What do you want<br>to get done?</h1>
  <p class="subtitle">Ask once. RADHA can reason, research, create, analyze, build and work through the next steps.</p>
  <div class="quick">
    <button data-fill="Research and compare ">Research</button>
    <button data-fill="Analyze this ">Analyze</button>
    <button data-fill="Create ">Create</button>
    <button data-fill="Build ">Build</button>
  </div>
  <div class="conversation" id="conversation"></div>
</section>
</main>
<nav class="glass bottomnav" aria-label="RADHA navigation">
  <button class="navitem active" id="home"><span class="navicon">⌂</span><span class="navlabel">Work</span></button>
  <button class="navitem" id="library"><span class="navicon">▱</span><span class="navlabel">Library</span></button>
  <button class="navitem" id="activity"><span class="navicon">◌</span><span class="navlabel">Activity</span></button>
</nav>
<div class="composerWrap">
  <div class="glass composer">
    <button class="action" id="attach" aria-label="Add">＋</button>
    <textarea class="prompt" id="prompt" rows="1" placeholder="Ask RADHA…"></textarea>
    <button class="action" id="voice" aria-label="Voice">◉</button>
    <button class="action send" id="send" aria-label="Send" disabled>↑</button>
  </div>
</div>
<div class="glass panel" id="panel">
  <button class="close" id="close">Close <span>×</span></button>
  <h3>RADHA</h3>
  <p>One intelligence. The interface stays simple while the work can become complex.</p>
  <button id="panelLibrary">Library <span>›</span></button>
  <button id="panelSettings">Settings <span>›</span></button>
</div>
<div class="toast" id="toast"></div>
<div class="splash" id="splash"><div class="splashInner"><div class="splashMark" id="splashMark"></div><div class="splashName">RADHA</div><div class="splashTag">ONE INTELLIGENCE</div></div></div>
</div>
<script>
(()=> {
const mark='<svg viewBox="0 0 64 64"><path fill="#fff" d="M15 47V17h14c11 0 18 5 18 14 0 6-3 10-8 12l8 4H36l-7-4h-5v4H15Zm9-12h5c6 0 9-2 9-6s-3-6-9-6h-5v12Z"/><circle cx="47" cy="15" r="4" fill="#b49458"/></svg>';
document.querySelector('.logo').innerHTML=mark;
document.getElementById('orb').innerHTML=mark;
document.getElementById('splashMark').innerHTML=mark;
const prompt=document.getElementById('prompt'),send=document.getElementById('send'),conversation=document.getElementById('conversation'),panel=document.getElementById('panel');
const toast=(t)=>{const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),1700)};
const resize=()=>{prompt.style.height='auto';prompt.style.height=Math.min(prompt.scrollHeight,150)+'px'};
prompt.addEventListener('input',()=>{send.disabled=!prompt.value.trim();resize()});
document.querySelectorAll('[data-fill]').forEach(b=>b.onclick=()=>{prompt.value=b.dataset.fill;prompt.focus();send.disabled=false;resize()});
document.getElementById('new').onclick=()=>{conversation.innerHTML='';conversation.classList.remove('visible');prompt.value='';send.disabled=true;prompt.focus()};
document.getElementById('profile').onclick=()=>panel.classList.add('open');
document.getElementById('search').onclick=()=>toast('Search is ready for your RADHA workspace.');
document.getElementById('close').onclick=()=>panel.classList.remove('open');
document.getElementById('library').onclick=()=>toast('Library is the persistent work layer.');
document.getElementById('activity').onclick=()=>toast('Activity will show active and completed work.');
document.getElementById('home').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('attach').onclick=()=>toast('Attach files, images or documents.');
document.getElementById('voice').onclick=()=>toast('Voice input ready.');
document.getElementById('panelLibrary').onclick=()=>toast('Library workspace ready.');
document.getElementById('panelSettings').onclick=()=>toast('Settings workspace ready.');
async function submit(){
 const text=prompt.value.trim(); if(!text)return;
 addMessage('user',text); prompt.value=''; send.disabled=true; resize();
 conversation.classList.add('visible');
 addMessage('radha','Thinking…','thinking');
 try{
   const res=await fetch('./api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,context:{surface:'workspace'}})});
   if(!res.ok) throw new Error('gateway unavailable');
   const data=await res.json();
   replaceThinking(data.reply || 'RADHA completed the request.');
 }catch(e){
   replaceThinking('RADHA understood the request. Connect the Intelligence Gateway to execute it.');
 }
}
function addMessage(role,text,cls=''){const wrap=document.createElement('div');wrap.className='message '+role+(cls?' '+cls:'');const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;wrap.appendChild(bubble);conversation.appendChild(wrap);conversation.scrollIntoView({behavior:'smooth',block:'end'});}
function replaceThinking(text){const el=conversation.querySelector('.thinking:last-child .bubble');if(el)el.textContent=text}
send.onclick=submit;
prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}});
setTimeout(()=>document.getElementById('splash').classList.add('off'),1100);
})();
</script>
<script src="./main.js"></script>
</body>
</html>
