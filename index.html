<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<link rel="stylesheet" href="./styles.css">
<title>RADHA</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#101828;--muted:#7d8795;--line:#e2e7ed;--blue:#294267;--gold:#b49458}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,textarea{font:inherit}button{border:0;background:none;cursor:pointer;color:inherit}.app{min-height:100dvh}.top{height:64px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px;position:sticky;top:0;background:#f7f8faf2;backdrop-filter:blur(18px);z-index:4}.brand{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.2em}.logo{width:30px;height:30px;border-radius:10px;background:var(--blue);display:grid;place-items:center}.logo svg{width:21px}.left{display:flex}.right{justify-self:end;display:flex;gap:7px;align-items:center}.icon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#6c7888;font-size:22px}.icon:hover{background:#fff}.avatar{width:34px;height:34px;border-radius:50%;border:1px solid #d8dee6;background:#fff;font-size:11px;font-weight:800;color:var(--blue)}.hero{text-align:center;padding:78px 18px 30px}.eyebrow{font-size:9px;letter-spacing:.22em;color:#9b8050;font-weight:800;text-transform:uppercase}.hero h1{font-size:clamp(42px,9vw,72px);line-height:.94;letter-spacing:-.065em;margin:15px 0;font-weight:760}.hero h1 span{color:#8c96a4}.hero p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 auto;max-width:490px}.composer{width:min(760px,calc(100% - 28px));margin:auto;background:var(--card);border:1px solid #d7dee7;border-radius:26px;box-shadow:0 25px 70px #18294312;overflow:hidden}.composer textarea{width:100%;height:118px;border:0;outline:0;padding:22px;background:transparent;resize:none;color:var(--ink);font-size:17px}.composer textarea::placeholder{color:#a3acb7}.bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 12px}.tools{display:flex;gap:3px}.tool{width:38px;height:38px;border-radius:11px;color:#687688;font-size:21px}.send{width:43px;height:43px;border-radius:50%;background:var(--blue);color:#fff;font-size:20px}.send:disabled{opacity:.3}.pills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:13px 14px 0}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 13px;color:#697587;font-size:10px}.content{width:min(920px,100%);margin:0 auto;padding:62px 16px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:13px}.label{font-size:9px;letter-spacing:.2em;color:#9b8050;font-weight:800;text-transform:uppercase}.head h2{font-size:22px;letter-spacing:-.04em;margin:5px 0 0}.works{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.work{display:flex;gap:12px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;min-height:88px}.wi{width:37px;height:37px;border-radius:11px;background:#eef2f5;display:grid;place-items:center;color:#667588;flex:0 0 auto}.work b{font-size:12px;display:block;line-height:1.35}.work small{display:block;color:#929ba7;font-size:9px;margin-top:5px}.foot{text-align:center;color:#a0a8b2;font-size:9px;padding:0 0 35px}.splash{position:fixed;inset:0;background:linear-gradient(#fbfcfd,#f4f6f8);z-index:20;display:grid;place-items:center;transition:opacity .45s}.splash.off{opacity:0;pointer-events:none}.splash .mark{width:72px;height:72px;border-radius:22px;background:var(--blue);display:grid;place-items:center;box-shadow:0 20px 55px #29426722}.splash .mark svg{width:49px}.sname{text-align:center;margin-top:17px;font-size:13px;font-weight:800;letter-spacing:.27em}.stag{text-align:center;margin-top:7px;font-size:8px;letter-spacing:.2em;color:#99a2ad}.sheet{position:fixed;inset:0;background:#1018281c;z-index:10;opacity:0;pointer-events:none;transition:.2s}.sheet.open{opacity:1;pointer-events:auto}.panel{position:absolute;right:12px;top:75px;width:min(330px,calc(100% - 24px));background:#fff;border:1px solid var(--line);border-radius:21px;padding:18px;box-shadow:0 30px 80px #17243a2b}.panel h3{margin:2px 0 7px}.panel p{font-size:11px;line-height:1.55;color:var(--muted)}.panel button{display:block;width:100%;text-align:left;padding:11px;border-radius:11px}.panel button:hover{background:#f0f3f6}.toast{position:fixed;z-index:30;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:#18243a;color:white;border-radius:999px;padding:9px 14px;font-size:10px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:620px){.top{height:58px;padding:0 9px}.hero{padding:58px 14px 27px}.hero h1{font-size:42px}.hero p{font-size:11px}.composer{width:calc(100% - 22px);border-radius:22px}.composer textarea{height:110px;padding:19px;font-size:16px}.content{padding:48px 13px}.works{grid-template-columns:1fr}.work{min-height:74px}.brand{font-size:10px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(()=>{const root=document.getElementById('root');
const mark='<svg viewBox="0 0 64 64"><path fill="#fff" d="M15 47V17h14c11 0 18 5 18 14 0 6-3 10-8 12l8 4H36l-7-4h-5v4H15Zm9-12h5c6 0 9-2 9-6s-3-6-9-6h-5v12Z"/><circle cx="47" cy="15" r="4" fill="#b49458"/></svg>';
const work=[['◎','Research the AI landscape','Today · Research'],['▧','Create a cinematic concept','Yesterday · Creation'],['→','Plan my weekend','Sep 30 · Planning'],['▤','Explain this document','Sep 28 · Files']];
root.innerHTML='<div class="app"><header class="top"><div class="left"><button class="icon" id="new">＋</button></div><div class="brand"><span class="logo">'+mark+'</span>RADHA</div><div class="right"><button class="icon" id="search">⌕</button><button class="avatar" id="profile">S</button></div></header><main><section class="hero"><div class="eyebrow">One intelligence</div><h1>What are we<br><span>working on?</span></h1><p>Bring the goal. RADHA works through the details, tools and steps with you.</p></section><section><div class="composer"><textarea id="prompt" placeholder="Ask RADHA anything…"></textarea><div class="bar"><div class="tools"><button class="tool" id="attach">＋</button><button class="tool" id="voice">♩</button><button class="tool" id="image">▧</button></div><button class="send" id="send" disabled>→</button></div></div><div class="pills"><button class="pill" data-fill="Research ">Research</button><button class="pill" data-fill="Analyze ">Analyze</button><button class="pill" data-fill="Create ">Create</button><button class="pill" data-fill="Build ">Build</button></div></section><section class="content"><div class="head"><div><div class="label">Continue</div><h2>Recent work</h2></div><button class="icon" id="search2">⌕</button></div><div class="works">'+work.map(x=>'<button class="work" data-fill="'+x[1]+'"><span class="wi">'+x[0]+'</span><span><b>'+x[1]+'</b><small>'+x[2]+'</small></span></button>').join('')+'</div></section></main><div class="foot">RADHA · One intelligence. Any job.</div></div><div class="splash" id="splash"><div><div class="splash mark">'+mark+'</div><div class="sname">RADHA</div><div class="stag">ONE INTELLIGENCE</div></div></div><div class="sheet" id="sheet"><div class="panel"><button id="close">Close</button><h3>RADHA</h3><p>One intelligence for research, creation, analysis, planning and complex work.</p><button>Library</button><button>Settings</button></div></div><div class="toast" id="toast"></div>';
const p=document.getElementById('prompt'),s=document.getElementById('send'),sheet=document.getElementById('sheet');
p.oninput=()=>s.disabled=!p.value.trim();
document.querySelectorAll('[data-fill]').forEach(b=>b.onclick=()=>{p.value=b.dataset.fill;p.focus();s.disabled=false});
s.onclick=()=>toast('RADHA is ready.');
document.getElementById('profile').onclick=()=>sheet.classList.add('open');document.getElementById('search').onclick=()=>sheet.classList.add('open');document.getElementById('search2').onclick=()=>sheet.classList.add('open');document.getElementById('close').onclick=()=>sheet.classList.remove('open');document.getElementById('new').onclick=()=>p.focus();
['attach','image'].forEach(id=>document.getElementById(id).onclick=()=>toast('Input layer ready.'));document.getElementById('voice').onclick=()=>toast('Voice input ready.');
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}
setTimeout(()=>document.getElementById('splash').classList.add('off'),1400);
})();
</script>
<script src="./main.js"></script>
</body>
</html>
